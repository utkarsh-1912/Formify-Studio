name: Server CI
on:
  push:
    branches: [main]
    paths: ["server/**", "src/utils/formifySchema.ts"]
  pull_request:
    paths: ["server/**", "src/utils/formifySchema.ts"]
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci # root deps: the server imports the shared schema module (ajv)
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm test
        working-directory: server
