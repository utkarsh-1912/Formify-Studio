# Fallback: QLoRA SFT for Qwen2.5-3B-Instruct. Same recipe as sft_qwen3_4b.yaml.
# LICENSE WARNING: as far as I know the Qwen2.5-3B models are NOT under Apache-2.0 (a separate Qwen research
# license applies). Read the license on the model card before training or releasing a derivative.
model:
  name: Qwen/Qwen2.5-3B-Instruct
  revision: null
  trust_remote_code: false
  chat_template_kwargs: {}

data:
  train: ml/data/out/dataset/train.jsonl
  val: ml/data/out/dataset/val.jsonl
  max_seq_length: 2048

quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
  bias: none

training:
  output_dir: ml/train/outputs/formify-schema-3b-sft
  num_train_epochs: 2
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  optim: paged_adamw_8bit
  seed: 42
  report_to: none
