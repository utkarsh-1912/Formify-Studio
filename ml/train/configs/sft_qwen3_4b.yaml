# QLoRA SFT for Qwen3-4B on Formify generate+edit data.
# UNTUNED STARTING POINT: values are common QLoRA defaults sized for one 24 GB GPU, not results of any run here.
# Verify the base model's license and current revision on its Hugging Face model card before training/releasing.
model:
  name: Qwen/Qwen3-4B
  revision: null            # pin a commit SHA after verifying the model card
  trust_remote_code: false
  # Qwen3 is a hybrid thinking model. We train the non-thinking format (empty think block) so outputs are bare JSON.
  chat_template_kwargs:
    enable_thinking: false

data:
  train: ml/data/out/dataset/train.jsonl
  val: ml/data/out/dataset/val.jsonl
  max_seq_length: 2048

quantization:               # QLoRA: 4-bit NF4 base weights, bf16 compute
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
  bias: none

training:
  output_dir: ml/train/outputs/formify-schema-4b-sft
  num_train_epochs: 2
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4   # effective batch 16
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  optim: paged_adamw_8bit
  seed: 42
  report_to: none
